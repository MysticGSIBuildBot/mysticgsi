name: MysticGSI - Build

run-name: "Build ${{ inputs.request_id }}"

# Build a GSI from a publicly reachable stock firmware archive.  The build is
# intentionally manual: firmware archives are large and are not suitable for
# storing in the repository or passing as workflow artifacts.
on:
  workflow_dispatch:
    inputs:
      build_name:
        description: "Name used for the temporary and output directories"
        required: true
        default: "mysticgsi"
        type: string
      firmware_url:
        description: "Public URL of the stock firmware archive"
        required: true
        type: string
      rom_type:
        description: "ROM type override (auto, generic, custom, or a supported patch name)"
        required: true
        default: "auto"
        type: string
      variant_tag:
        description: "Optional variant tag appended to the build name"
        required: false
        default: ""
        type: string
      no_debloat:
        description: "Keep apps normally removed by the patch set"
        required: true
        default: false
        type: boolean
      request_id:
        description: "Bot request id (used by the bot to find this run)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: mysticgsi-build-${{ inputs.request_id || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.build_name }}
    # slimhub_actions supports the current Ubuntu images explicitly.  Pinning
    # the image avoids an unexpected runner change during a long build.
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # A stock firmware can expand to many gigabytes.  Remove unused
      # preinstalled software before downloading it, as in the OrangeFox
      # builder, then add swap for filesystem/image creation.
      - name: Free runner disk space
        uses: rokibhasansagar/slimhub_actions@main

      - name: Add swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      - name: Show runner capacity
        shell: bash
        run: |
          set -euo pipefail
          echo "Memory and swap:"
          free -h
          swapon --show || true
          echo
          echo "Filesystem capacity:"
          df -h "${GITHUB_WORKSPACE}"

      - name: Install build environment
        shell: bash
        run: |
          set -euo pipefail
          ./setup_host.py
          .venv/bin/python -c 'import tools; tools.check_environment()'

      - name: Build GSI
        env:
          BUILD_NAME: ${{ inputs.build_name }}
          FIRMWARE_URL: ${{ inputs.firmware_url }}
          ROM_TYPE: ${{ inputs.rom_type }}
          VARIANT_TAG: ${{ inputs.variant_tag }}
          NO_DEBLOAT: ${{ inputs.no_debloat }}
        shell: bash
        run: |
          set -euo pipefail

          # Use an array so URLs containing '?', '&', or '=' are passed to
          # Python as one argument and never interpreted by the shell.
          args=(build "$BUILD_NAME" "$FIRMWARE_URL" --type "$ROM_TYPE")
          if [[ -n "$VARIANT_TAG" ]]; then
            args+=(--add "$VARIANT_TAG")
          fi
          # The workflow publishes only the ZIP, so always create it.  The
          # image remains an intermediate build product on the runner.
          args+=(--compress)
          if [[ "$NO_DEBLOAT" == "true" ]]; then
            args+=(--no-debloat)
          fi

          .venv/bin/python cli.py "${args[@]}"

      - name: Collect and verify outputs
        env:
          BUILD_NAME: ${{ inputs.build_name }}
          ROM_TYPE: ${{ inputs.rom_type }}
          VARIANT_TAG: ${{ inputs.variant_tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          archives=(out/*/*.zip)
          if (( ${#archives[@]} == 0 )); then
            echo "No ZIP archive was produced under out/" >&2
            find out -maxdepth 3 -type f -print 2>/dev/null || true
            exit 1
          fi

          rm -rf release
          mkdir -p release
          max_part_bytes=$((1900 * 1024 * 1024))
          original_checksums=$(mktemp)
          : > "$original_checksums"

          # Release assets are limited to less than 2 GiB each.  Keep the
          # original ZIP for the workflow artifact, but split oversized files
          # into 1900 MiB parts for the release.  The fixed-width suffix keeps
          # shell glob ordering stable when the file is reassembled.
          outputs=(out/*/*.zip)
          for source in "${outputs[@]}"; do
            [[ -f "$source" ]] || continue
            name=$(basename "$source")
            sha256sum -- "$source" | awk -v name="$name" '{print $1 "  " name}' >> "$original_checksums"
            file_size=$(wc -c < "$source")
            if (( file_size > max_part_bytes )); then
              split -b 1900M -d -a 4 -- "$source" "release/${name}.part."
            else
              cp -- "$source" "release/${name}"
            fi
          done

          for file in out/*/output.txt; do
            [[ -f "$file" ]] || continue
            cp -- "$file" release/
          done

          # This manifest is checked after concatenating any .part.* files.
          cp -- "$original_checksums" release/SHA256SUMS.reassembled

          cat > release/REASSEMBLE.md <<'EOF'
          # Reassembling large output files

          GitHub Release limits an individual asset to 2 GiB, so a large ZIP
          is published as `.part.000`, `.part.001`, and so on.  Download all
          parts into one directory and run:

          ```sh
          cat 'FILE.part.'* > 'FILE'
          sha256sum -c SHA256SUMS.reassembled
          ```

          Replace `FILE` with the original filename shown in
          `SHA256SUMS.reassembled`.
          EOF

          # Write the release-asset checksum list outside release first so
          # SHA256SUMS does not accidentally contain a checksum of itself.
          checksums=$(mktemp)
          (
            cd release
            for file in *; do
              [[ "$file" == "SHA256SUMS" ]] && continue
              sha256sum -- "$file"
            done
          ) > "$checksums"
          mv -- "$checksums" release/SHA256SUMS
          {
            echo "### MysticGSI build"
            echo
            echo "- Build name: \`$BUILD_NAME\`"
            echo "- ROM type: \`$ROM_TYPE\`"
            if [[ -n "$VARIANT_TAG" ]]; then
              echo "- Variant: \`$VARIANT_TAG\`"
            fi
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo
            echo "Release files (with SHA-256 checksums):"
            echo
            echo '```text'
            cat release/SHA256SUMS
            echo '```'
            echo
            echo "Large ZIP files are split into 1900 MiB parts for the GitHub Release asset limit."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Produced files:"
          du -h release/*

      # Upload only the original ZIP as a workflow artifact.  If the
      # repository's artifact quota or per-artifact limit is exhausted, keep
      # going so the split Release is still published.
      - name: Upload ZIP artifact
        id: upload_zip
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mysticgsi-${{ inputs.build_name }}-zip-${{ github.run_id }}
          path: out/*/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Report artifact upload status
        if: always()
        env:
          ZIP_STATUS: ${{ steps.upload_zip.outcome }}
        shell: bash
        run: |
          {
            echo "### Workflow artifact uploads"
            echo "- ZIP artifact: ${ZIP_STATUS}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set release metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "BUILD_DATE=$(TZ=Asia/Shanghai date +%Y%m%d-%H%M)" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=mysticgsi-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import glob, html, json, os, re

          entry = json.load(open("tmp/gsilist.json"))[-1]
          text = html.unescape(re.sub(r"<[^>]+>", "", entry["output"]))
          head, _, info = text.partition("\n\nInfo: ")
          notes = f"{head.strip()}\n\nInfo:\n{info.strip()}\n"
          parts = sorted(glob.glob("release/*.part.0000"))
          if parts:
              name = os.path.basename(parts[0])[: -len(".part.0000")]
              notes += (
                  "\nThe ZIP is split into parts because GitHub limits files to 2 GB. "
                  "Download all parts into one folder and join them.\n\n"
                  f"Windows (cmd):\n```\ncopy /b {name}.part.* {name}\n```\n\n"
                  f"Linux / macOS:\n```\ncat {name}.part.* > {name}\n```\n\n"
                  "Check the result with `sha256sum -c SHA256SUMS.reassembled` "
                  "(macOS: `shasum -a 256 -c SHA256SUMS.reassembled`).\n"
              )
          open("release_notes.md", "w").write(notes)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"RELEASE_TITLE={entry['output_name']}\n")
          PY

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
          name: ${{ env.RELEASE_TITLE }}
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          body_path: release_notes.md
